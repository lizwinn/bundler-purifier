# SPDX-License-Identifier: MIT
#
# Runs the flake's checks: the CLI build, the sandboxed builds of the
# fixtures under tests/fixtures and a run of each, and the formatting.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
